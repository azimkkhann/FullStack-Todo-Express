<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <style>
         body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d1321;
            font-family: Arial, Helvetica, sans-serif;
        }

        #signin-box{
            height: 400px;
            width: 500px;
            display: flex;;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            
            border-radius: 10px;
            background-color: #1d2d44;
        }

        .inputs{
            width: 400px;
            height: 30px;
        }
    </style>
</head>
<body>

    <div id="signin-box">
    
                <input type="text" name="username-input" id="signin-username-input" class="inputs" placeholder="Username">
                <input type="text" name="password-input" id="signin-password-input" class="inputs" placeholder="Password">
                <button name="submit-button-input" id="signin-submit-button" class="inputs" >Sign in</button>
                <button  type="button" name="submit-button-input" id="signin-submit-button" class="inputs">Sign up</button>
           
       
    </div>

    <script src="signin.js"></script>
    
</body>
</html>
