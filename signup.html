<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d1321;
            font-family: Arial, Helvetica, sans-serif;
        }
        form{
            height: 400px;
            width: 500px;
            display: flex;;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            
            border-radius: 10px;
            background-color: #1d2d44;
        }
        #signup-box{
             height: 400px;
            width: 500px;
            display: flex;;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            
            border-radius: 10px;
            background-color: #1d2d44;
        }
        .inputs{
            width: 400px;
            height: 30px;
        }

    </style>
</head>
<body>

    <div id="signup-box">
   
        <input type="text" name="usernameinput" id="signup-username-input" class="inputs" placeholder="Username">
        <input type="text" name="password" id="signup-password-input"  class="inputs" placeholder="Password">
        <button  class="inputs" id="signup-button" style="border-radius: 8px;">Signup</button>
        <button class="inputs" type="button" style="border-radius: 8px; background-color:pink"> Signin</button>
   
    </div>

    <script src="signup.js"></script>
</body>
</html>
