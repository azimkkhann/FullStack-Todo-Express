<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d1321;
            font-family: Arial, Helvetica, sans-serif;
        }
        form{
            height: 400px;
            width: 500px;
            display: flex;;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            
            border-radius: 10px;
            background-color: #1d2d44;
        }
        .inputs{
            width: 400px;
            height: 30px;
        }

    </style>
</head>
<body>

    <div id="signup-box">
    <form action="/signup", method="POST">
        <input type="text" name="usernameinput" class="inputs" placeholder="Username">
        <input type="text" name="password" class="inputs" placeholder="Password">
        <button type="submit" class="inputs" style="border-radius: 8px;">Signup</button>
        <button class="inputs" type="button" style="border-radius: 8px; background-color:pink"> Signin</button>
    </form>
    </div>

    <script src="signup.js"> </script>
</body>
</html>
